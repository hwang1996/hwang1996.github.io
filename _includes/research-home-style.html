
<style>
  .page__title {
    display: none;
  }

  #main {
    max-width: 1440px;
    margin-top: 1.25rem;
  }

  article.page {
    float: none;
    width: 100%;
    padding: 0;
  }

  .research-home {
    --ink: #0f172a;
    --muted: #526078;
    --line: #dce5f2;
    --blue: #2558d8;
    --cyan: #0e9fbc;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: -0.01em;
  }

  .research-home,
  .research-home * {
    box-sizing: border-box;
  }

  .page__content .research-home a {
    text-decoration: none;
  }

  .research-home p,
  .research-home li {
    margin: 0;
    line-height: 1.6;
    text-align: left;
  }

  .research-home h1,
  .research-home h2,
  .research-home h3 {
    margin: 0;
    color: var(--ink);
    font-family: inherit;
    letter-spacing: -0.035em;
  }

  .research-home h2 {
    padding: 0;
    border: 0;
  }

  .rh-hero {
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 190px;
    gap: clamp(2rem, 5vw, 5rem);
    overflow: hidden;
    padding: clamp(2rem, 5vw, 4.6rem);
    border: 1px solid #d8e5ff;
    border-radius: 28px;
    background:
      radial-gradient(circle at 88% 15%, rgba(56, 189, 248, 0.24), transparent 27%),
      radial-gradient(circle at 70% 90%, rgba(124, 58, 237, 0.12), transparent 30%),
      linear-gradient(135deg, #f8fbff 0%, #edf4ff 55%, #f8f7ff 100%);
    box-shadow: 0 24px 70px rgba(30, 64, 175, 0.09);
  }

  .rh-hero::after {
    position: absolute;
    z-index: -1;
    top: -120px;
    right: -95px;
    width: 330px;
    height: 330px;
    border: 1px solid rgba(37, 99, 235, 0.17);
    border-radius: 50%;
    box-shadow: 0 0 0 44px rgba(37, 99, 235, 0.035), 0 0 0 88px rgba(8, 145, 178, 0.025);
    content: "";
  }

  .rh-eyebrow,
  .rh-kicker {
    display: block;
    color: var(--blue);
    font-size: 0.72rem;
    font-weight: 850;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .rh-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    margin-bottom: 1.15rem;
  }

  .rh-eyebrow::before {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #06b6d4;
    box-shadow: 0 0 0 5px rgba(6, 182, 212, 0.13);
    content: "";
  }

  .rh-hero h1 {
    max-width: 820px;
    font-size: clamp(2.5rem, 6vw, 5.25rem);
    font-weight: 800;
    line-height: 0.99;
  }

  .rh-hero h1 span {
    color: #3157d5;
    background: linear-gradient(105deg, #1d4ed8, #7c3aed 72%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .rh-hero__lead {
    max-width: 760px;
    margin-top: 1.45rem !important;
    color: #334155;
    font-size: clamp(1rem, 1.7vw, 1.18rem);
  }

  .rh-hero__meta {
    margin-top: 1rem !important;
    color: #65738a;
    font-size: 0.78rem;
    font-weight: 650;
  }

  .rh-actions,
  .rh-links,
  .rh-tags,
  .rh-footer__links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
  }

  .rh-actions {
    margin-top: 1.6rem;
  }

  .rh-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0.68rem 1rem;
    border: 1px solid #cbd8ee;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.84);
    color: #1e3a5f !important;
    font-size: 0.84rem;
    font-weight: 760;
    transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
  }

  .rh-button:hover {
    border-color: #8fb0ed;
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
    transform: translateY(-2px);
  }

  .rh-button--primary {
    border-color: #1d4ed8;
    background: #1d4ed8;
    color: #fff !important;
  }

  .rh-portrait {
    align-self: center;
    justify-self: end;
    width: 100%;
    max-width: 190px;
  }

  .rh-portrait img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 6px solid rgba(255, 255, 255, 0.82);
    border-radius: 28px;
    object-fit: cover;
    box-shadow: 0 22px 54px rgba(30, 64, 175, 0.2);
  }

  .rh-path {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px;
    overflow: hidden;
    margin: 1rem 0 0;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--line);
  }

  .rh-path a {
    padding: 0.9rem 1rem;
    background: #fff;
    color: #334155 !important;
    font-size: 0.78rem;
    font-weight: 760;
    text-align: center;
  }

  .rh-path a:hover {
    color: var(--blue) !important;
    background: #f8fbff;
  }

  .rh-section {
    padding: clamp(3.6rem, 8vw, 6.2rem) clamp(0.15rem, 2.5vw, 2rem) 0;
  }

  .rh-section__head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 2rem;
    margin-bottom: 1.7rem;
  }

  .rh-section__head h2 {
    margin-top: 0.45rem;
    font-size: clamp(2rem, 4vw, 3.25rem);
    line-height: 1.05;
  }

  .rh-section__head p {
    max-width: 520px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .rh-showcases {
    display: grid;
    gap: 1.15rem;
  }

  .rh-showcase {
    display: grid;
    grid-template-columns: minmax(0, 1.42fr) minmax(300px, 0.78fr);
    gap: clamp(1.25rem, 3.5vw, 3.25rem);
    align-items: center;
    padding: clamp(1rem, 2vw, 1.5rem);
    border: 1px solid var(--line);
    border-radius: 22px;
    background: #fff;
    box-shadow: 0 14px 38px rgba(15, 23, 42, 0.05);
  }

  .rh-showcase--reverse {
    grid-template-columns: minmax(300px, 0.78fr) minmax(0, 1.42fr);
  }

  .rh-showcase--reverse .rh-media {
    grid-column: 2;
    grid-row: 1;
  }

  .rh-showcase--reverse .rh-showcase__copy {
    grid-column: 1;
    grid-row: 1;
  }

  .rh-media {
    position: relative;
    overflow: hidden;
    border-radius: 15px;
    background: #0b1426;
  }

  .rh-media img,
  .rh-media video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    object-fit: cover;
  }

  .rh-concept {
    display: grid;
    width: 100%;
    aspect-ratio: 16 / 9;
    padding: clamp(1rem, 3vw, 2.2rem);
    color: #f8fafc;
  }

  .rh-concept--wm {
    align-content: center;
    gap: 0.65rem;
    background:
      radial-gradient(circle at 85% 15%, rgba(190, 242, 100, 0.17), transparent 24%),
      linear-gradient(135deg, #091625, #10283c);
  }

  .rh-ladder {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr) auto;
    gap: 0.8rem;
    align-items: center;
    padding: 0.8rem 0.9rem;
    border-left: 3px solid var(--step-color);
    background: rgba(255, 255, 255, 0.045);
  }

  .rh-ladder:nth-child(1) { --step-color: #8b5cf6; margin-right: 12%; }
  .rh-ladder:nth-child(2) { --step-color: #38bdf8; margin-left: 6%; margin-right: 6%; }
  .rh-ladder:nth-child(3) { --step-color: #fb7185; margin-left: 12%; }

  .rh-ladder b {
    font-size: clamp(0.9rem, 2vw, 1.45rem);
  }

  .rh-ladder small,
  .rh-ladder em {
    color: #94a3b8;
    font-size: clamp(0.5rem, 1vw, 0.68rem);
    font-style: normal;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .rh-concept--ai {
    position: relative;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.16), transparent 34%),
      linear-gradient(135deg, #0b1026, #141d43);
  }

  .rh-loop {
    position: relative;
    display: grid;
    width: min(58%, 320px);
    aspect-ratio: 1 / 1;
    place-items: center;
    border: 2px solid rgba(139, 157, 255, 0.7);
    border-radius: 50%;
    box-shadow: inset 0 0 45px rgba(127, 208, 200, 0.08), 0 0 45px rgba(99, 102, 241, 0.13);
  }

  .rh-loop::before,
  .rh-loop::after {
    position: absolute;
    border-radius: 50%;
    content: "";
  }

  .rh-loop::before {
    width: 72%;
    height: 72%;
    border: 2px solid rgba(127, 208, 200, 0.68);
  }

  .rh-loop::after {
    top: 8%;
    right: 2%;
    width: 12px;
    height: 12px;
    background: #8b9dff;
    box-shadow: -210px 100px 0 #7fd0c8, -80px 230px 0 #8b9dff;
  }

  .rh-loop__text {
    z-index: 1;
    color: #e2e8f0;
    font-size: clamp(0.65rem, 1.4vw, 0.9rem);
    font-weight: 780;
    letter-spacing: 0.12em;
    line-height: 1.55;
    text-align: center;
    text-transform: uppercase;
  }

  .rh-loop__text span {
    display: block;
    color: #7fd0c8;
  }

  .rh-media__badge {
    position: absolute;
    right: 0.75rem;
    bottom: 0.75rem;
    padding: 0.35rem 0.55rem;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    background: rgba(8, 15, 30, 0.78);
    color: #fff;
    font-size: 0.64rem;
    font-weight: 750;
    letter-spacing: 0.04em;
    backdrop-filter: blur(8px);
  }

  .rh-showcase__copy {
    padding: 0.35rem clamp(0.2rem, 1vw, 0.8rem);
  }

  .rh-showcase__copy h3 {
    margin-top: 0.4rem;
    font-size: clamp(1.65rem, 3vw, 2.55rem);
    line-height: 1.06;
  }

  .rh-showcase__copy p {
    margin-top: 0.85rem !important;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .rh-tags {
    margin-top: 1rem;
  }

  .rh-tags span {
    padding: 0.3rem 0.5rem;
    border: 1px solid #dce5f2;
    border-radius: 999px;
    background: #f8fafc;
    color: #53637a;
    font-size: 0.67rem;
    font-weight: 700;
  }

  .rh-links {
    margin-top: 1.2rem;
  }

  .rh-links a {
    color: #1746a2 !important;
    font-size: 0.78rem;
    font-weight: 820;
  }

  .rh-links a::after {
    content: " ↗";
  }

  .rh-work-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.9rem;
  }

  .rh-work-card {
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #fff;
    transition: transform 160ms ease, box-shadow 160ms ease;
  }

  .rh-work-card:hover {
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.09);
    transform: translateY(-3px);
  }

  .rh-work-card img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
  }

  .rh-work-card__body {
    padding: 0.85rem 0.95rem 1rem;
  }

  .rh-work-card__body span {
    color: var(--blue);
    font-size: 0.63rem;
    font-weight: 820;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .rh-work-card__body h3 {
    margin-top: 0.28rem;
    font-size: 1rem;
    line-height: 1.2;
  }

  .rh-more {
    display: flex;
    flex-wrap: wrap;
    gap: 0.7rem 1rem;
    margin-top: 1rem;
    color: #64748b;
    font-size: 0.75rem;
  }

  .rh-more a {
    color: #365a8a !important;
    font-weight: 740;
  }

  .rh-info-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(320px, 0.85fr);
    gap: 1rem;
  }

  .rh-panel {
    padding: clamp(1.4rem, 3vw, 2.2rem);
    border: 1px solid var(--line);
    border-radius: 20px;
    background: #fff;
  }

  .rh-panel h2 {
    margin-top: 0.45rem;
    font-size: clamp(1.55rem, 2.8vw, 2.2rem);
    line-height: 1.1;
  }

  .rh-panel > p {
    margin-top: 0.85rem !important;
    color: var(--muted);
    font-size: 0.88rem;
  }

  .rh-news {
    list-style: none;
    margin: 1rem 0 0;
    padding: 0;
  }

  .rh-news li {
    display: grid;
    grid-template-columns: 70px minmax(0, 1fr);
    gap: 0.75rem;
    padding: 0.65rem 0;
    border-top: 1px solid #edf1f7;
    color: #40506a;
    font-size: 0.76rem;
  }

  .rh-news time {
    color: var(--blue);
    font-weight: 820;
  }

  .rh-collab {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2rem;
    align-items: center;
    margin-top: clamp(3.6rem, 8vw, 6.2rem);
    padding: clamp(1.8rem, 4vw, 3.2rem);
    border-radius: 24px;
    background: #101b35;
    color: #c9d6ea;
  }

  .rh-collab h2 {
    color: #fff;
    font-size: clamp(1.8rem, 3.8vw, 3rem);
    line-height: 1.05;
  }

  .rh-collab p {
    max-width: 760px;
    margin-top: 0.7rem !important;
    color: #b9c7df;
    font-size: 0.88rem;
  }

  .rh-collab .rh-button {
    border-color: #67e8f9;
    background: #67e8f9;
    color: #10203d !important;
    white-space: nowrap;
  }

  .rh-footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.9rem;
    padding: 1.5rem 0 0;
    color: #64748b;
    font-size: 0.72rem;
  }

  .rh-footer a {
    color: #31527f !important;
    font-weight: 740;
  }

  .rh-updated {
    width: 100%;
    padding-top: 0.5rem;
    color: #94a3b8;
    font-size: 0.63rem;
    text-align: right;
  }

  .research-home a:focus-visible {
    outline: 3px solid rgba(37, 99, 235, 0.35);
    outline-offset: 3px;
  }

  @media (max-width: 900px) {
    .rh-showcase,
    .rh-showcase--reverse,
    .rh-info-grid {
      grid-template-columns: 1fr;
    }

    .rh-showcase--reverse .rh-media,
    .rh-showcase--reverse .rh-showcase__copy {
      grid-column: 1;
      grid-row: auto;
    }

    .rh-work-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 700px) {
    #main {
      margin-top: 0.75rem;
      padding-right: 0.75rem;
      padding-left: 0.75rem;
    }

    .rh-hero {
      grid-template-columns: 1fr;
      border-radius: 20px;
    }

    .rh-portrait {
      grid-row: 1;
      justify-self: start;
      width: 90px;
    }

    .rh-portrait img {
      border-width: 4px;
      border-radius: 18px;
    }

    .rh-path,
    .rh-work-grid,
    .rh-collab {
      grid-template-columns: 1fr;
    }

    .rh-section__head {
      display: block;
    }

    .rh-section__head p {
      margin-top: 0.8rem !important;
    }

    .rh-collab .rh-button {
      justify-self: start;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .rh-button,
    .rh-work-card {
      transition: none;
    }
  }
</style>
